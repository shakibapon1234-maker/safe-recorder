<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:rgba(0,0,0,.18);cursor:crosshair;font:16px 'Segoe UI','Nirmala UI',sans-serif;user-select:none}
#bar{position:fixed;top:12px;left:50%;transform:translateX(-50%);background:#0b1630;color:#fff;padding:10px 22px;border-radius:30px;border:2px solid #f5b301;z-index:5}
.box{position:fixed;border:2px solid #ff3b4e;background:rgba(255,59,78,.25)}
.box b{position:absolute;top:-12px;right:-12px;width:24px;height:24px;border-radius:50%;background:#ff3b4e;color:#fff;text-align:center;line-height:24px;cursor:pointer;font-size:14px}
#cur{position:fixed;border:2px dashed #f5b301;background:rgba(245,179,1,.2);display:none}
</style></head><body><div id="bar">ড্র্যাগ করে বক্স আঁকুন • বক্সের ✕ চাপলে মুছবে • <b>Enter</b> = সেভ • <b>Escape</b> = বাতিল</div><div id="cur"></div><div id="boxes"></div>
<script>
let boxes = [], start = null; const W = () => innerWidth, H = () => innerHeight;
const cur = document.getElementById('cur'), holder = document.getElementById('boxes');
function render() {
  holder.innerHTML = '';
  boxes.forEach((b, i) => { const d = document.createElement('div'); d.className = 'box';
    d.style.left = b.x * W() + 'px'; d.style.top = b.y * H() + 'px'; d.style.width = b.w * W() + 'px'; d.style.height = b.h * H() + 'px';
    const x = document.createElement('b'); x.textContent = '✕';
    x.addEventListener('mousedown', (e) => { e.stopPropagation(); boxes.splice(i, 1); render(); });
    d.appendChild(x); holder.appendChild(d); });
}
window.api.onInitOverlay((d) => { boxes = (d.boxes || []).slice(); render(); });
document.addEventListener('mousedown', (e) => { start = { x: e.clientX, y: e.clientY }; });
document.addEventListener('mousemove', (e) => { if (!start) return;
  cur.style.display = 'block'; cur.style.left = Math.min(start.x, e.clientX) + 'px'; cur.style.top = Math.min(start.y, e.clientY) + 'px';
  cur.style.width = Math.abs(e.clientX - start.x) + 'px'; cur.style.height = Math.abs(e.clientY - start.y) + 'px'; });
document.addEventListener('mouseup', (e) => { if (!start) return; cur.style.display = 'none';
  const w = Math.abs(e.clientX - start.x), h = Math.abs(e.clientY - start.y);
  if (w > 8 && h > 8) boxes.push({ x: Math.min(start.x, e.clientX) / W(), y: Math.min(start.y, e.clientY) / H(), w: w / W(), h: h / H() });
  start = null; render(); });
document.addEventListener('keydown', (e) => { if (e.key === 'Enter') window.api.overlayDone(boxes); if (e.key === 'Escape') window.api.overlayCancel(); });
</script></body></html>
